\* Tiny TLC configuration: 2 orders, 1 qty, 2 prices, no amend.
\* Smallest completed configuration in the results table.

INIT Init
NEXT NextNoAmend

CONSTANTS
    NULL = NULL
    TICK_SIZE = 1
    MAX_QTY = 1
    MAX_ORDERS = 2
    MAX_CLOCK = 4
    PRICES = {1, 2}

INVARIANTS
    BookUncrossed
    NoEmptyLevels
    NoGhosts
    StatusConsistency
    FIFOWithinLevel
    NoRestingMarkets
    PostOnlyGuarantee
    STPGuarantee
    NoRestingMTL
    NoRestingMinQty
