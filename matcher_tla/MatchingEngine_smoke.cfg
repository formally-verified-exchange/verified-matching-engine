\* Fast safety config for scripts/verify.sh.
\*
\* Deliberately minimal: one price level, qty up to 2. That is the smallest
\* configuration that can still produce a PARTIAL fill (resting qty < incoming
\* qty), which is required to reach the resting-insertion branch of Dispose and
\* therefore to exercise the RestingPrice assertion. A config with MAX_QTY = 1
\* fills completely and never rests a remainder.
\*
\* For depth, use MatchingEngine.cfg / _noamend.cfg / _amend.cfg.

INIT Init
NEXT NextNoAmend

CONSTANTS
    NULL = NULL
    TICK_SIZE = 1
    MAX_QTY = 2
    MAX_ORDERS = 2
    MAX_CLOCK = 3
    PRICES = {1}

INVARIANTS
    BookUncrossed
    NoEmptyLevels
    NoGhosts
    StatusConsistency
    FIFOWithinLevel
    NoRestingMarkets
    PostOnlyGuarantee
    STPGuarantee
    NoRestingMTL
    NoRestingMinQty
