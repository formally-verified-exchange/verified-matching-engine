\* Small TLC configuration: 2 orders, 2 qty, 2 prices, no amend.

INIT Init
NEXT NextNoAmend

CONSTANTS
    NULL = NULL
    TICK_SIZE = 1
    MAX_QTY = 2
    MAX_ORDERS = 2
    MAX_CLOCK = 4
    PRICES = {1, 2}

INVARIANTS
    BookUncrossed
    NoEmptyLevels
    NoGhosts
    StatusConsistency
    FIFOWithinLevel
    NoRestingMarkets
    PostOnlyGuarantee
    STPGuarantee
    NoRestingMTL
    NoRestingMinQty
